<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CASe CAS API — Docs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.11.0/swagger-ui.css" />

  <style>
    /* ── RESET & ROOT ─────────────────────────────────────────────────── */
    :root {
      --bg:       #0c0c0f;
      --bg2:      #111115;
      --bg3:      #16161c;
      --panel:    #13131a;
      --border:   rgba(255, 210, 100, 0.08);
      --border2:  rgba(255, 210, 100, 0.16);
      --border3:  rgba(255, 210, 100, 0.30);
      --gold:     #ffd264;
      --gold2:    #e8b840;
      --gold-dim: rgba(255, 210, 100, 0.45);
      --gold-gradient: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
      --teal:     #3de8c4;
      --teal-dim: rgba(61, 232, 196, 0.15);
      --red:      #ff6b6b;
      --red-dim:  rgba(255, 107, 107, 0.12);
      --blue:     #4da8ff;
      --blue-dim: rgba(77, 168, 255, 0.12);
      --orange:   #ff9f64;
      --orange-dim: rgba(255, 159, 100, 0.12);
      --green:    #64d98a;
      --green-dim:rgba(100, 217, 138, 0.12);
      --muted:    #44445a;
      --dim:      #888898;
      --text:     #d8d8e8;
      --mono:     'JetBrains Mono', monospace;
      --sans:     'DM Sans', sans-serif;
      --serif:    'Instrument Serif', Georgia, serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.6;
    }

    /* scanlines */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    /* radial glow */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 50% 35% at 15% 5%, rgba(255,210,100,0.04) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 85% 90%, rgba(61,232,196,0.04) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── TOP NAV ──────────────────────────────────────────────────────── */
    .ml-topbar {
      position: sticky;
      top: 0;
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      height: 52px;
      background: rgba(12,12,15,0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .ml-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .ml-brand-glyph {
      font-family: var(--serif);
      font-style: italic;
      font-size: 22px;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 16px rgba(77,163,255,0.08);
      line-height: 1;
    }

    .ml-brand-name {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: 0.5px;
    }

    .ml-brand-name span {
      color: var(--dim);
      font-weight: 300;
    }

    .ml-topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .ml-topbar-link {
      font-size: 12px;
      color: var(--dim);
      text-decoration: none;
      letter-spacing: 0.3px;
      transition: color 0.15s;
    }

    .ml-topbar-link:hover { 
      background: var(--gold-gradient); 
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent; 
      background-clip: text;
    }

    .ml-version-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--teal);
      border: 1px solid rgba(61,232,196,0.2);
      border-radius: 100px;
      padding: 2px 9px;
      background: rgba(61,232,196,0.05);
      letter-spacing: 0.5px;
    }

    .ml-version-badge::before {
      content: '';
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--teal);
      animation: pulse 2s ease infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* ── SWAGGER WRAPPER ──────────────────────────────────────────────── */
    #swagger-ui {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px 80px;
      position: relative;
      z-index: 1;
    }

    /* ── TOPBAR (swagger's own) — hide it ────────────────────────────── */
    .swagger-ui .topbar { display: none !important; }

    /* ── INFO BLOCK ───────────────────────────────────────────────────── */
    .swagger-ui .info {
      margin-bottom: 32px;
    }

    .swagger-ui .info hgroup.main {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .swagger-ui .info .title {
      font-family: var(--serif) !important;
      font-style: italic !important;
      font-size: 38px !important;
      font-weight: 400 !important;
      background: var(--gold-gradient) !important;
      -webkit-background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
      background-clip: text !important;
      letter-spacing: -0.5px;
      line-height: 1;
      text-shadow: 0 0 30px rgba(77,163,255,0.06);
      padding-bottom: 20px;
    }

    .swagger-ui .info .title small {
      font-family: var(--mono) !important;
      font-style: normal !important;
      font-size: 11px !important;
      color: var(--dim) !important;
      letter-spacing: 2px;
      text-transform: uppercase;
      display: block;
      margin-top: 6px;
    }

    .swagger-ui .info .title small pre {
      background: rgba(255,210,100,0.07);
      border: 1px solid var(--border2);
      border-radius: 5px;
      padding: 2px 8px;
      font-size: 11px;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .swagger-ui .info p,
    .swagger-ui .info li,
    .swagger-ui .info table td,
    .swagger-ui .info table th {
      font-family: var(--sans) !important;
      font-size: 13px !important;
      color: var(--dim) !important;
      line-height: 1.7 !important;
    }

    .swagger-ui .info a {
      color: var(--teal) !important;
      text-decoration: none;
    }

    .swagger-ui .info a:hover { text-decoration: underline; }

    /* ── SCHEME SELECTOR / SERVERS ──────────────────────────────────── */
    .swagger-ui .scheme-container {
      background: var(--bg2) !important;
      border: 1px solid var(--border) !important;
      border-radius: 10px !important;
      padding: 14px 20px !important;
      box-shadow: none !important;
      margin-bottom: 24px;
    }

    .swagger-ui .scheme-container .schemes > label {
      font-family: var(--mono) !important;
      font-size: 10px !important;
      color: var(--dim) !important;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .swagger-ui select {
      background: var(--bg3) !important;
      border: 1px solid var(--border2) !important;
      border-radius: 6px !important;
      color: var(--text) !important;
      font-family: var(--mono) !important;
      font-size: 12px !important;
      padding: 5px 10px !important;
      outline: none !important;
    }

    /* ── AUTHORIZE BUTTON ─────────────────────────────────────────────── */
    .swagger-ui .auth-wrapper .authorize {
      background: rgba(255,210,100,0.08) !important;
      border: 1px solid var(--border3) !important;
      border-radius: 8px !important;
      font-family: var(--mono) !important;
      font-size: 12px !important;
      letter-spacing: 0.5px;
      padding: 8px 18px !important;
      cursor: pointer;
      transition: all 0.15s;
      background-clip: padding-box;
      color: transparent !important;
      background-image: var(--gold-gradient) !important;
      -webkit-background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
    }

    .swagger-ui .auth-wrapper .authorize:hover {
      background: rgba(255,210,100,0.14) !important;
      box-shadow: 0 0 14px rgba(255,210,100,0.15);
    }

    .swagger-ui .auth-wrapper .authorize svg { fill: var(--gold) !important; }

    /* ── TAG GROUPS ───────────────────────────────────────────────────── */
    .swagger-ui .opblock-tag {
      font-family: var(--mono) !important;
      font-size: 11px !important;
      font-weight: 500 !important;
      color: var(--dim) !important;
      letter-spacing: 2px !important;
      text-transform: uppercase !important;
      border-bottom: 1px solid var(--border) !important;
      padding: 14px 0 10px !important;
      margin-top: 8px !important;
    }

    .swagger-ui .opblock-tag:hover { background: transparent !important; color: transparent !important; background-image: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

    .swagger-ui .opblock-tag svg { fill: var(--muted) !important; }

    /* ── OPERATION BLOCKS ─────────────────────────────────────────────── */
    .swagger-ui .opblock {
      border-radius: 10px !important;
      border: 1px solid var(--border) !important;
      background: var(--bg2) !important;
      box-shadow: none !important;
      margin-bottom: 8px !important;
      overflow: hidden;
      transition: border-color 0.15s;
    }

    .swagger-ui .opblock:hover { border-color: var(--border2) !important; }

    /* summary rows */
    .swagger-ui .opblock .opblock-summary {
      border: none !important;
      padding: 0 !important;
    }

    .swagger-ui .opblock .opblock-summary-control {
      padding: 12px 16px !important;
      align-items: center !important;
      gap: 12px !important;
    }

    .swagger-ui .opblock .opblock-summary-path,
    .swagger-ui .opblock .opblock-summary-path__deprecated {
      font-family: var(--mono) !important;
      font-size: 13px !important;
      font-weight: 400 !important;
      color: var(--text) !important;
    }

    .swagger-ui .opblock .opblock-summary-description {
      font-family: var(--sans) !important;
      font-size: 12px !important;
      color: var(--dim) !important;
    }

    /* method badges */
    .swagger-ui .opblock-summary-method {
      font-family: var(--mono) !important;
      font-size: 10px !important;
      font-weight: 600 !important;
      letter-spacing: 1px !important;
      border-radius: 5px !important;
      padding: 3px 9px !important;
      min-width: 58px !important;
      text-align: center !important;
    }

    /* POST */
    .swagger-ui .opblock.opblock-post {
      border-left: 3px solid var(--teal) !important;
    }
    .swagger-ui .opblock.opblock-post .opblock-summary-method {
      background: var(--teal-dim) !important;
      color: var(--teal) !important;
    }
    .swagger-ui .opblock.opblock-post .opblock-summary { background: transparent !important; }

    /* GET */
    .swagger-ui .opblock.opblock-get {
      border-left: 3px solid var(--blue) !important;
    }
    .swagger-ui .opblock.opblock-get .opblock-summary-method {
      background: var(--blue-dim) !important;
      color: var(--blue) !important;
    }
    .swagger-ui .opblock.opblock-get .opblock-summary { background: transparent !important; }

    /* DELETE */
    .swagger-ui .opblock.opblock-delete {
      border-left: 3px solid var(--red) !important;
    }
    .swagger-ui .opblock.opblock-delete .opblock-summary-method {
      background: var(--red-dim) !important;
      color: var(--red) !important;
    }
    .swagger-ui .opblock.opblock-delete .opblock-summary { background: transparent !important; }

    /* PUT */
    .swagger-ui .opblock.opblock-put {
      border-left: 3px solid var(--orange) !important;
    }
    .swagger-ui .opblock.opblock-put .opblock-summary-method {
      background: var(--orange-dim) !important;
      color: var(--orange) !important;
    }
    .swagger-ui .opblock.opblock-put .opblock-summary { background: transparent !important; }

    /* PATCH */
    .swagger-ui .opblock.opblock-patch {
      border-left: 3px solid var(--green) !important;
    }
    .swagger-ui .opblock.opblock-patch .opblock-summary-method {
      background: var(--green-dim) !important;
      color: var(--green) !important;
    }

    /* expanded body */
    .swagger-ui .opblock .opblock-body {
      background: var(--bg3) !important;
      border-top: 1px solid var(--border) !important;
      padding: 16px !important;
    }

    .swagger-ui .opblock-description-wrapper p,
    .swagger-ui .opblock-external-docs-wrapper p,
    .swagger-ui .opblock-title_normal p {
      font-family: var(--sans) !important;
      font-size: 13px !important;
      color: var(--dim) !important;
      line-height: 1.7 !important;
    }

    /* ── PARAMETERS ───────────────────────────────────────────────────── */
    .swagger-ui table thead tr td,
    .swagger-ui table thead tr th {
      font-family: var(--mono) !important;
      font-size: 10px !important;
      color: var(--muted) !important;
      text-transform: uppercase !important;
      letter-spacing: 1.5px !important;
      border-bottom: 1px solid var(--border) !important;
      background: transparent !important;
      padding: 8px 0 !important;
    }

    .swagger-ui table tbody tr td {
      font-family: var(--sans) !important;
      font-size: 13px !important;
      color: var(--text) !important;
      border-bottom: 1px solid var(--border) !important;
      padding: 8px 12px 8px 0 !important;
      background: transparent !important;
    }

    .swagger-ui .parameter__name {
      font-family: var(--mono) !important;
      font-size: 13px !important;
      font-weight: 400 !important;
      color: transparent !important;
      background-image: var(--gold-gradient) !important;
      -webkit-background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
      background-clip: text !important;
    }

    .swagger-ui .parameter__type {
      font-family: var(--mono) !important;
      font-size: 11px !important;
      color: var(--teal) !important;
    }

    .swagger-ui .parameter__in {
      font-family: var(--mono) !important;
      font-size: 10px !important;
      color: var(--dim) !important;
      font-style: normal !important;
    }

    .swagger-ui .required > .parameter__name::after {
      content: ' *';
      color: var(--red);
      font-size: 11px;
    }

    /* ── INPUTS ───────────────────────────────────────────────────────── */
    .swagger-ui input[type=text],
    .swagger-ui input[type=password],
    .swagger-ui input[type=email],
    .swagger-ui textarea {
      background: var(--bg) !important;
      border: 1px solid var(--border2) !important;
      border-radius: 7px !important;
      color: var(--text) !important;
      font-family: var(--mono) !important;
      font-size: 13px !important;
      padding: 8px 12px !important;
      outline: none !important;
      transition: border-color 0.15s;
    }

    .swagger-ui input[type=text]:focus,
    .swagger-ui input[type=password]:focus,
    .swagger-ui textarea:focus {
      border-color: var(--border3) !important;
      box-shadow: 0 0 0 3px rgba(255,210,100,0.06) !important;
    }

    .swagger-ui textarea {
      min-height: 100px;
    }

    /* ── BUTTONS ──────────────────────────────────────────────────────── */
    .swagger-ui .btn {
      font-family: var(--mono) !important;
      font-size: 12px !important;
      border-radius: 7px !important;
      border: 1px solid var(--border2) !important;
      background: transparent !important;
      color: var(--dim) !important;
      padding: 7px 14px !important;
      cursor: pointer !important;
      transition: all 0.15s !important;
      letter-spacing: 0.3px;
    }

    .swagger-ui .btn:hover {
      color: var(--text) !important;
      border-color: var(--border3) !important;
      background: rgba(255,210,100,0.05) !important;
    }

    .swagger-ui .btn.execute {
      background: rgba(255,210,100,0.09) !important;
      border-color: var(--border3) !important;
      color: transparent !important;
      background-image: var(--gold-gradient) !important;
      -webkit-background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
      background-clip: text !important;
    }

    .swagger-ui .btn.execute:hover {
      background: rgba(255,210,100,0.16) !important;
      box-shadow: 0 0 14px rgba(255,210,100,0.15) !important;
    }

    .swagger-ui .btn.cancel {
      border-color: rgba(255,107,107,0.2) !important;
      color: var(--red) !important;
    }

    .swagger-ui .btn.cancel:hover {
      background: var(--red-dim) !important;
      border-color: rgba(255,107,107,0.4) !important;
    }

    .swagger-ui .btn.try-out__btn {
      color: var(--teal) !important;
      border-color: rgba(61,232,196,0.2) !important;
    }

    .swagger-ui .btn.try-out__btn:hover {
      background: var(--teal-dim) !important;
      border-color: rgba(61,232,196,0.4) !important;
    }

    .swagger-ui .btn.try-out__btn.cancel {
      color: var(--red) !important;
      border-color: rgba(255,107,107,0.2) !important;
    }

    /* ── RESPONSE SECTION ─────────────────────────────────────────────── */
    .swagger-ui .responses-wrapper {
      border-top: 1px solid var(--border) !important;
      padding-top: 14px !important;
      margin-top: 14px !important;
    }

    .swagger-ui .responses-inner h4,
    .swagger-ui .responses-inner h5 {
      font-family: var(--mono) !important;
      font-size: 10px !important;
      color: var(--dim) !important;
      letter-spacing: 2px !important;
      text-transform: uppercase !important;
      font-weight: 500 !important;
    }

    .swagger-ui .response-col_status {
      font-family: var(--mono) !important;
      font-size: 13px !important;
      color: transparent !important;
      background-image: var(--gold-gradient) !important;
      -webkit-background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
      background-clip: text !important;
    }

    .swagger-ui .response-col_description {
      font-family: var(--sans) !important;
      font-size: 13px !important;
      color: var(--dim) !important;
    }

    /* ── CODE / MICROFORMAT ───────────────────────────────────────────── */
    .swagger-ui .microlight,
    .swagger-ui .highlight-code,
    .swagger-ui pre.microlight {
      background: var(--bg) !important;
      border: 1px solid var(--border) !important;
      border-radius: 8px !important;
      padding: 14px 16px !important;
      font-family: var(--mono) !important;
      font-size: 12px !important;
      color: var(--teal) !important;
      line-height: 1.7 !important;
    }

    .swagger-ui .response-control-media-type__accept-message {
      color: var(--dim) !important;
      font-family: var(--mono) !important;
      font-size: 11px !important;
    }

    /* live response */
    .swagger-ui .live-responses-wrap .live-response-col_description {
      background: var(--bg) !important;
    }

    /* curl command */
    .swagger-ui .curl-command {
      background: var(--bg) !important;
      border: 1px solid var(--border) !important;
      border-radius: 8px !important;
      padding: 12px 14px !important;
      color: var(--dim) !important;
      font-family: var(--mono) !important;
      font-size: 12px !important;
    }

    .swagger-ui .curl-command > .curl {
      color: var(--text) !important;
    }

    /* response status box */
    .swagger-ui table.responses-table .response td.response-col_status .response-undocumented {
      color: var(--dim) !important;
      font-family: var(--mono) !important;
      font-size: 11px !important;
    }

    /* ── SCHEMA / MODEL ───────────────────────────────────────────────── */
    .swagger-ui .model {
      font-family: var(--mono) !important;
      font-size: 12px !important;
      color: var(--dim) !important;
    }

    .swagger-ui .model .property {
      color: transparent !important;
      background-image: var(--gold-gradient) !important;
      -webkit-background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
      background-clip: text !important;
    }

    .swagger-ui .model-title {
      font-family: var(--mono) !important;
      font-size: 12px !important;
      color: var(--text) !important;
    }

    .swagger-ui section.models {
      background: var(--bg2) !important;
      border: 1px solid var(--border) !important;
      border-radius: 10px !important;
      padding: 16px !important;
      margin-top: 24px !important;
    }

    .swagger-ui section.models h4 {
      font-family: var(--mono) !important;
      font-size: 10px !important;
      letter-spacing: 2px !important;
      text-transform: uppercase !important;
      color: var(--dim) !important;
      font-weight: 500 !important;
    }

    .swagger-ui .model-box {
      background: var(--bg3) !important;
      border-radius: 6px !important;
      border: 1px solid var(--border) !important;
    }

    .swagger-ui .prop-type {
      color: var(--teal) !important;
      font-family: var(--mono) !important;
      font-size: 11px !important;
    }

    .swagger-ui .prop-format {
      color: var(--dim) !important;
      font-family: var(--mono) !important;
      font-size: 10px !important;
    }

    /* ── MODAL (auth dialog) ──────────────────────────────────────────── */
    .swagger-ui .dialog-ux .backdrop-ux {
      background: rgba(0,0,0,0.7) !important;
      backdrop-filter: blur(6px) !important;
    }

    .swagger-ui .dialog-ux .modal-ux {
      background: var(--bg2) !important;
      border: 1px solid var(--border2) !important;
      border-radius: 14px !important;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7) !important;
    }

    .swagger-ui .dialog-ux .modal-ux-header {
      background: transparent !important;
      border-bottom: 1px solid var(--border) !important;
      padding: 16px 20px !important;
    }

    .swagger-ui .dialog-ux .modal-ux-header h3 {
      font-family: var(--serif) !important;
      font-style: italic !important;
      font-size: 20px !important;
      font-weight: 400 !important;
      color: transparent !important;
      background-image: var(--gold-gradient) !important;
      -webkit-background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
      background-clip: text !important;
    }

    .swagger-ui .dialog-ux .modal-ux-content {
      padding: 16px 20px !important;
    }

    .swagger-ui .dialog-ux .modal-ux-content p {
      font-family: var(--sans) !important;
      font-size: 13px !important;
      color: var(--dim) !important;
    }

    .swagger-ui .dialog-ux .modal-ux-content label {
      font-family: var(--mono) !important;
      font-size: 10px !important;
      color: var(--dim) !important;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    /* ── LOADING SPINNER ─────────────────────────────────────────────── */
    .swagger-ui .loading-container {
      background: transparent !important;
    }

    .swagger-ui .loading-container .loading::after {
      border-color: var(--gold) transparent var(--gold) transparent !important;
    }

    /* ── MISC ─────────────────────────────────────────────────────────── */
    .swagger-ui .arrow { filter: invert(0.6); }

    .swagger-ui svg.arrow { fill: var(--dim) !important; }

    /* validation errors */
    .swagger-ui .errors-wrapper {
      background: var(--red-dim) !important;
      border: 1px solid rgba(255,107,107,0.2) !important;
      border-radius: 8px !important;
    }

    .swagger-ui .errors-wrapper .errors h4 {
      font-family: var(--mono) !important;
      font-size: 12px !important;
      color: var(--red) !important;
    }

    /* copy button */
    .swagger-ui .copy-to-clipboard {
      background: var(--bg3) !important;
      border: 1px solid var(--border) !important;
      border-radius: 5px !important;
    }

    .swagger-ui .copy-to-clipboard:hover {
      border-color: var(--border2) !important;
    }

    /* scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a3a4a; }

    /* ── RESPONSE STATUS COLOURS ─────────────────────────────────────── */
    .swagger-ui .response-col_status .response-undocumented { color: var(--dim) !important; }

    .swagger-ui table.responses-table td.response-col_status {
      font-family: var(--mono) !important;
      font-size: 14px !important;
    }

    /* 2xx */
    .swagger-ui .response_current .response-col_status,
    .swagger-ui .responses-table .response-col_status[data-status-code^="2"] {
      color: var(--teal) !important;
    }

    /* 4xx / 5xx */
    .swagger-ui .responses-table .response-col_status[data-status-code^="4"],
    .swagger-ui .responses-table .response-col_status[data-status-code^="5"] {
      color: var(--red) !important;
    }

    /* ── EXPAND/COLLAPSE all ──────────────────────────────────────────── */
    .swagger-ui .expand-operation svg { fill: var(--dim) !important; }

    /* ── FOOTER STRIP ─────────────────────────────────────────────────── */
    .ml-footer {
      text-align: center;
      padding: 24px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.5px;
      border-top: 1px solid var(--border);
      margin-top: 40px;
      position: relative;
      z-index: 1;
    }
    :root {
      --bg: #060b14;
      --surface: #0a1220;
      --surface2: #0e192b;
      --border: rgba(99,178,255,0.08);
      --border-bright: rgba(99,178,255,0.18);
      --text: #dceeff;
      --muted: #5a7a99;
      --muted2: #3d5a75;
      --accent: #3de6c0;
      --accent2: #4da3ff;
      --accent3: #f06aff;
      --warn: #ff9f4a;
      --glow: rgba(61,230,192,0.12);
      --glow2: rgba(77,163,255,0.10);
    }
    span.hero-accent {
      background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;   
      font-weight: bold; 
      font-size: 32px;
    }
    
  </style>
</head>
<body>

  <!-- Custom top nav -->
  <nav class="ml-topbar">
    <a href="/" class="ml-brand">
      <span class="hero-accent">∂</span>
      <span class="ml-brand-name">CASe <span>CAS API</span></span>
    </a>
    <div class="ml-topbar-right">
      <a href="/" class="ml-topbar-link">← Home</a>
      <a href="/console" class="ml-topbar-link">Console</a>
      <span class="ml-version-badge">v1beta1</span>
    </div>
  </nav>

  <div id="swagger-ui"></div>

  <div class="ml-footer">
    CASe CAS API · Built on FastAPI &amp; SymPy
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.11.0/swagger-ui-bundle.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.11.0/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = () => {
      SwaggerUIBundle({
        url: "/openapi.json",
        dom_id: "#swagger-ui",
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout: "StandaloneLayout",
        deepLinking: true,
        displayRequestDuration: true,
        defaultModelsExpandDepth: 1,
        defaultModelExpandDepth: 2,
        docExpansion: "list",
        filter: false,
        syntaxHighlight: {
          activated: true,
          theme: "monokai",
        },
        tryItOutEnabled: true,
        persistAuthorization: true,
      });
    };
  </script>
</body>
</html>
